openapi: 3.1.0
info:
  title: User Service API
  description: Управление профилями пассажиров и водителей, аутентификация
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Local

tags:
  - name: passengers
    description: Профили пассажиров
  - name: drivers
    description: Профили и статусы водителей
  - name: auth
    description: Аутентификация

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Получить JWT токен
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /passengers:
    post:
      tags: [passengers]
      summary: Зарегистрировать пассажира
      operationId: createPassenger
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PassengerRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /passengers/{id}:
    get:
      tags: [passengers]
      summary: Получить профиль пассажира
      operationId: getPassenger
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers:
    post:
      tags: [drivers]
      summary: Зарегистрировать водителя
      operationId: createDriver
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /drivers/{id}:
    get:
      tags: [drivers]
      summary: Получить профиль водителя
      operationId: getDriver
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers/{id}/status:
    patch:
      tags: [drivers]
      summary: Обновить статус водителя
      operationId: updateDriverStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /drivers/available:
    get:
      tags: [drivers]
      summary: Список свободных водителей (кэшируется в Redis 30s)
      operationId: listAvailableDrivers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DriverResponse'

  /drivers/assign:
    post:
      tags: [drivers]
      summary: Атомарно зарезервировать свободного водителя (SELECT FOR UPDATE SKIP LOCKED)
      description: Используется trip-service для эксклюзивной выдачи водителя при создании поездки.
      operationId: assignAvailableDriver
      responses:
        '200':
          description: Driver reserved (status -> BUSY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverResponse'
        '409':
          description: No available drivers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Invalid credentials or missing token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflict (e.g., duplicate email)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@taxi.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret

    LoginResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Lifetime in milliseconds

    PassengerRequest:
      type: object
      required: [name, email, phone, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
        password:
          type: string
          format: password
          minLength: 6

    PassengerResponse:
      type: object
      required: [id, name, email, phone, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        created_at:
          type: string
          format: date-time

    DriverRequest:
      type: object
      required: [name, email, phone, license_number, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        email:
          type: string
          format: email
        phone:
          type: string
          pattern: '^\+?[0-9]{10,15}$'
        license_number:
          type: string
          minLength: 4
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 6

    DriverResponse:
      type: object
      required: [id, name, email, phone, license_number, status, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        license_number:
          type: string
        status:
          $ref: '#/components/schemas/DriverStatus'
        created_at:
          type: string
          format: date-time

    DriverStatus:
      type: string
      enum: [AVAILABLE, BUSY, OFFLINE]

    DriverStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/DriverStatus'

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
