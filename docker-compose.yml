services:
  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taxi_user} -d ${POSTGRES_DB:-taxi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: taxi-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: taxi-user-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "8081:8081"

  trip-service:
    build:
      context: .
      dockerfile: trip-service/Dockerfile
    container_name: taxi-trip-service
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      notification-service:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
      USER_SERVICE_URL: http://user-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8083
      JWT_SECRET: ${JWT_SECRET}
      TRIP_TARIFF_RATE: ${TRIP_TARIFF_RATE:-25.0}
    ports:
      - "8082:8082"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: taxi-notification-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-taxi}
      POSTGRES_USER: ${POSTGRES_USER:-taxi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxi_password}
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATION_WORKER_POOL_SIZE: ${NOTIFICATION_WORKER_POOL_SIZE:-4}
      NOTIFICATION_WORKER_POLL_INTERVAL_MS: ${NOTIFICATION_WORKER_POLL_INTERVAL_MS:-1000}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-3}
    ports:
      - "8083:8083"

volumes:
  postgres_data:
  redis_data:
