dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // AOP (в SB4 нет starter-aop, подключаем модули напрямую)
    implementation 'org.springframework:spring-aop'
    implementation 'org.aspectj:aspectjweaver'

    // Resilience4j (spring-boot3 starter работает с SB4 на уровне аннотаций @Retry/@CircuitBreaker)
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.2.0'

    // JWT (валидация входящих токенов)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'
    testImplementation 'org.testcontainers:postgresql:1.20.4'
}

openApiGenerate {
    generatorName.set('spring')
    inputSpec.set("$rootDir/openapi/trip-service.yaml")
    outputDir.set("${layout.buildDirectory.get()}/generated")
    apiPackage.set('com.taxi.trip.api')
    modelPackage.set('com.taxi.trip.dto')
    invokerPackage.set('com.taxi.trip.invoker')
    configOptions.set([
        interfaceOnly       : 'true',
        useSpringBoot3      : 'true',
        useTags             : 'true',
        dateLibrary         : 'java8',
        serializationLibrary: 'jackson',
        useJakartaEe        : 'true',
        skipDefaultInterface: 'true'
    ])
}
